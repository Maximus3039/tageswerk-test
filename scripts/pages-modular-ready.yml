# FREIGABE ERFORDERLICH
# Diese Datei ist die vorbereitete GitHub-Pages-Konfiguration für den modularisierten Stand.
# Nicht nach .github/workflows/pages.yml übernehmen, solange der Pin noch auf 3f0fa84 zeigt.
# Beim endgültigen Release in einem Schritt:
# 1. ref auf den Release-Commit setzen
# 2. diese Expected-Liste und SHELL_CACHE=mod1 aktivieren
# 3. nach main pushen (löst dann den Deploy aus)

name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Geprüften Release holen
        uses: actions/checkout@v4
        with:
          ref: REPLACE_WITH_RELEASE_COMMIT

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Anwendungsdateien vorbereiten
        run: node scripts/prepare-netlify.mjs

      - name: Veröffentlichung prüfen
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -printf '%P\n' | sort > /tmp/pages-actual.txt
          cat > /tmp/pages-expected.txt <<'EOF'
          css/app.css
          icon-192.png
          icon-512.png
          index.html
          js/app.js
          js/auth.js
          js/dashboard.js
          js/defects-store.js
/defects-ui.js
/defects.js
          js/labels.js
          js/meter-import-profiles.js
          js/meter-import-review.js
          js/meter-import-store.js
          js/meter-import.js
          js/meters-domain.js
          js/meters-store.js
          js/meters-ui.js
          js/meters.js
          js/mobile.js
          js/operations-controls.js
          js/operations-store.js
          js/operations-ui-figures.js
          js/operations-ui-sections.js
          js/operations-ui-shared.js
          js/operations-ui-temperature.js
          js/operations-ui-water.js
          js/operations-ui.js
          js/operations.js
          js/password-reset.js
          js/permissions.js
          js/staff-ui.js
          js/state.js
          js/supabase.js
          js/utils.js
          manifest.webmanifest
          service-worker.js
          vendor/xlsx.full.min.js
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/pages-expected.txt
          diff -u /tmp/pages-expected.txt /tmp/pages-actual.txt
          grep -q '<title>Tageswerk 3.5.6</title>' dist/index.html
          grep -q 'src="./js/app.js"' dist/index.html
          grep -q 'href="./css/app.css"' dist/index.html
          grep -q 'href="./manifest.webmanifest"' dist/index.html
          grep -q "register('./service-worker.js')" dist/index.html
          grep -q '"name": "Tageswerk 3.5.6"' dist/manifest.webmanifest
          grep -q '"start_url": "./"' dist/manifest.webmanifest
          grep -q "SHELL_CACHE = 'tageswerk-shell-3.5.6'" dist/service-worker.js
          grep -q 'eqtrifscedpsngsysxvc.supabase.co' dist/js/supabase.js
          if grep -R -E -n 'service_role|sb_secret_' dist; then
            exit 1
          fi

      - name: Seitenpaket bereitstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Auf der bestehenden Adresse veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
