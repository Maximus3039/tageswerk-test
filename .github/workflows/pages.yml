name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Geprüften Release holen
        uses: actions/checkout@v4
        with:
          # 3.6.3 Release. Rollback 3.6.2: 9a3887d9dd1dbc9e02175b7b99f1f9a03099708f
          ref: 5d6a3b4749042bdf0906c8b1985f5bdac6fe7355

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Anwendungsdateien vorbereiten
        run: node scripts/prepare-netlify.mjs

      - name: Veröffentlichung prüfen
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -printf '%P\n' | sort > /tmp/pages-actual.txt
          cat > /tmp/pages-expected.txt <<'EOF'
          css/app.css
          css/theme-3.6.css
          css/tokens.css
          icon-192.png
          icon-512.png
          index.html
          js/app.js
          js/auth.js
          js/consumption-analytics.js
          js/dashboard-layouts.js
          js/dashboard.js
          js/defects-store.js
          js/defects-ui.js
          js/defects.js
          js/invite-recipient.js
          js/labels.js
          js/management-dashboard.js
          js/meter-import-profiles.js
          js/meter-import-review.js
          js/meter-import-store.js
          js/meter-import.js
          js/meters-domain.js
          js/meters-store.js
          js/meters-ui.js
          js/meters.js
          js/mobile.js
          js/nexus-icons.js
          js/operations-controls.js
          js/operations-store.js
          js/operations-ui-figures.js
          js/operations-ui-sections.js
          js/operations-ui-shared.js
          js/operations-ui-temperature.js
          js/operations-ui-water.js
          js/operations-ui.js
          js/operations.js
          js/password-reset.js
          js/permissions.js
          js/preferences.js
          js/staff-ui.js
          js/state.js
          js/statistics.js
          js/supabase.js
          js/utils.js
          js/visitor-import.js
          js/water-filters.js
          js/weather.js
          manifest.webmanifest
          service-worker.js
          vendor/xlsx.full.min.js
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/pages-expected.txt
          diff -u /tmp/pages-expected.txt /tmp/pages-actual.txt
          grep -q '<title>Tageswerk 3.6.3</title>' dist/index.html
          grep -q 'src="./js/app.js"' dist/index.html
          grep -q 'href="./css/app.css"' dist/index.html
          grep -q 'href="./css/theme-3.6.css"' dist/index.html
          grep -q 'href="./manifest.webmanifest"' dist/index.html
          grep -q "register('./service-worker.js')" dist/index.html
          test -f dist/css/tokens.css
          test -f dist/js/nexus-icons.js
          grep -q '"name": "Tageswerk 3.6.3"' dist/manifest.webmanifest
          grep -q '"start_url": "./"' dist/manifest.webmanifest
          grep -q "SHELL_CACHE = 'tageswerk-shell-3.6.3'" dist/service-worker.js
          grep -q 'eqtrifscedpsngsysxvc.supabase.co' dist/js/supabase.js
          if grep -R -E -n 'gamvnzggcrrlnyoknllu|test\.tageswerk\.local' dist; then
            exit 1
          fi
          if grep -R -E -n 'service_role|sb_secret_' dist; then
            exit 1
          fi

      - name: Seitenpaket bereitstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf der bestehenden Adresse veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
