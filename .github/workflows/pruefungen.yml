name: Prüfungen

on:
  pull_request:
  push:
    branches:
      - modularisierung

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Entwicklungswerkzeuge installieren
        run: npm ci
      - name: Syntax und lokale Tests
        run: npm test
      - name: Browser für Oberflächentests installieren
        run: npx playwright install --with-deps chromium
      - name: Oberflächentests
        run: npm run test:ui
