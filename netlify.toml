# Build für die bestehende Netlify-Seite. Veröffentlicht wird nur dist.
[build]
  command = "node scripts/prepare-netlify.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
